[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-preference-analysis"
version = "1.0.0"
description = "Cluster MovieLens user preferences and recommend unseen movies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
movie-preference = "movie_preference_app.cli:main"
movie-preference-web = "movie_preference_app.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
